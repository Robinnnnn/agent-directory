<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- connecting lines -->
  <line x1="64" y1="30" x2="30" y2="88" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="64" y1="30" x2="98" y2="88" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="88" x2="98" y2="88" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>

  <!-- outer glow -->
  <circle cx="64" cy="30" r="26" fill="url(#glow)" filter="url(#softglow)" opacity="0.7"/>
  <circle cx="30" cy="88" r="26" fill="url(#glow)" filter="url(#softglow)" opacity="0.7"/>
  <circle cx="98" cy="88" r="26" fill="url(#glow)" filter="url(#softglow)" opacity="0.7"/>

  <!-- inner glow -->
  <circle cx="64" cy="30" r="16" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="30" cy="88" r="16" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="98" cy="88" r="16" fill="url(#glow)" filter="url(#blur)"/>

  <!-- solid core -->
  <circle cx="64" cy="30" r="11" fill="#93c5fd"/>
  <circle cx="30" cy="88" r="11" fill="#93c5fd"/>
  <circle cx="98" cy="88" r="11" fill="#93c5fd"/>
</svg>
